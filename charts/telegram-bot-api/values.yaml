replicaCount: 1

image:
  repository: ghcr.io/jisfw/telegram-bot-api
  pullPolicy: IfNotPresent
  tag: "10.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

telegram:
  existingSecret: ""
  apiId: ""
  apiHash: ""
  apiIdKey: TELEGRAM_API_ID
  apiHashKey: TELEGRAM_API_HASH

ports:
  http: 8081
  stat: 8082

service:
  type: ClusterIP
  annotations: {}
  ports:
    http: 8081
    stat: 8082

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: telegram.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

basicAuth:
  enabled: false
  existingSecret: ""
  secretName: ""
  auth: ""
  removeHeader: true

traefik:
  middleware:
    enabled: false
    apiVersion: traefik.containo.us/v1alpha1
    name: ""

persistence:
  enabled: true
  existingClaim: ""
  mountPath: /opt/telegram-bot-api
  accessModes:
    - ReadWriteOnce
  size: 40Gi
  storageClassName: ""
  volumeMode: Filesystem
  retentionPolicy:
    enabled: true
    whenDeleted: Retain
    whenScaled: Retain

resources:
  requests:
    cpu: 1000m
    memory: 1000Mi

livenessProbe:
  enabled: true
  failureThreshold: 3
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 3

readinessProbe:
  enabled: true
  failureThreshold: 3
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 3

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext: {}

automountServiceAccountToken: false
terminationGracePeriodSeconds: 30

extraEnv: []
extraEnvFrom: []

nodeSelector: {}
tolerations: []
affinity: {}
